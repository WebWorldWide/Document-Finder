[package]
name = "document-finder"
version = "0.3.0"
description = "Find, download, and read open-access research for AI"
authors = ["Web World Wide"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[lib]
name = "document_finder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Linux: use the real org.freedesktop.portal.FileChooser portal (rfd's
# xdg-portal backend) instead of the default raw GTK3 file chooser, so the
# picker can browse the whole host filesystem (incl. removable media) even
# under stricter sandboxing. macOS/Windows are unaffected — rfd's native
# backends there aren't gated by this feature switch.
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
rusqlite = { version = "0.31", features = ["bundled"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "time", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
async-trait = "0.1"

# HTTP
# http2: multiplexed connections to the big repositories; brotli/zstd: smaller
# API responses. rustls only — no OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "brotli", "zstd", "http2"] }
bytes = "1"
url = "2"
# Local SearXNG-compatible HTTP server (in-process, no Docker).
axum = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.36", features = ["serialize"] }

# File formats
# PDFium (BSD-3, Chrome's PDF engine) via pdfium-render (MIT/Apache-2.0): the
# primary PDF text extractor. The native library is bundled per platform as a
# Tauri resource (scripts/fetch-pdfium.mjs); pdf-extract stays as a pure-Rust
# fallback when PDFium can't be loaded.
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_latest", "thread_safe"] }
pdf-extract = "0.7"
zip = "2"
# EPUB/HTML/text cleanup
unicode-normalization = "0.1"
whatlang = "0.16"
chardetng = "0.1"
encoding_rs = "0.8"
scraper = "0.20"
ego-tree = "0.6"

# Concurrency primitives
parking_lot = "0.12"

# Utilities
regex = "1"
once_cell = "1"
md-5 = "0.10"
hex = "0.4"
# Opens a downloaded document in the OS default app (ShellExecuteW on Windows,
# `open` on macOS, xdg-open on Linux). MIT/Apache-2.0, permissive.
open = "5"
percent-encoding = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
fs2 = "0.4"
num_cpus = "1"

# Errors / logging
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Content hashes for the cross-library reuse index.
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
tempfile = "3"
wiremock = "0.6"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
opt-level = 0
split-debuginfo = "unpacked"

[profile.release]
panic = "unwind"
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Day-to-day "release that compiles in a reasonable amount of time" profile.
# Full LTO + codegen-units=1 (the `release` profile above) literally serializes
# code generation onto one CPU core — that's why builds didn't pin CPU.
# `release-fast` keeps opt-level=3 but parallelizes codegen and uses thin LTO
# instead of fat. Roughly 3–4× faster compile, binary ~5% larger, performance
# indistinguishable for a Tauri app. `run.sh` uses this; the strict `release`
# profile stays available for actual ship builds (DMG distributions etc.).
[profile.release-fast]
inherits = "release"
codegen-units = 16
lto = "thin"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
# These are noisy false-positives or stylistic preferences for this codebase.
too_many_arguments = "allow"
module_inception = "allow"
needless_doctest_main = "allow"
