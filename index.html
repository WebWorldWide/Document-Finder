<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Document Finder</title>
    <script>
      // Pre-paint theme (mirrors src/stores/theme.ts) so there's no flash.
      (function () {
        var p = null;
        try {
          p = localStorage.getItem("df-theme-v3");
        } catch (e) {}
        var dark =
          p === "dark" ||
          (p !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        var s = document.createElement("style");
        s.textContent = "html,body{background:" + (dark ? "#121311" : "#f3f0e8") + ";}";
        document.head.appendChild(s);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
